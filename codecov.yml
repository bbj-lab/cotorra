# informational only: codecov reports coverage but never fails a check
codecov:
  require_ci_to_pass: false
  notify:
    # one upload per python version in .github/workflows/tests.yml
    after_n_builds: 4

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, files"
  require_changes: true
  after_n_builds: 4
