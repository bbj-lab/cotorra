%YAML 1.2
---
# Larger architecture (hidden_size 256->1024, intermediate_size 1024->2048,
# num_hidden_layers 6->8) than every prior basis-blended run, combined with
# k=5 (down from 8), trainable alpha/beta, importance scaling OFF. Tests
# whether more model capacity (rather than more/fewer basis elements) is
# what moves the needle, holding the basis-blended mechanism itself close to
# the best config found so far (plain k=8 tuned: train_beta_params=true,
# train_importance_scale unset/off).
model:
  model_name: meta-llama/Llama-3.2-1B
  model_args:
    hidden_size: !!int 1024
    intermediate_size: !!int 2048
    num_hidden_layers: !!int 8
    num_attention_heads: !!int 8
    max_position_embeddings: !!int 32768

max_seq_len: !!int 1024
n_epochs: !!int 1
run_name: &run_name basis-blended-mimic-tune-k5-large

wandb:
  project: cotorra
  run_name: *run_name

custom_loss: !!bool true
basis_blended_tokens:
  k: !!int 5
  train_beta_params: !!bool true
  train_importance_scale: !!bool false

tuning_args:
  direction: minimize
  backend: optuna
  n_trials: !!int 10

training_args:
  report_to: wandb
  run_name: *run_name
  per_device_train_batch_size: !!int 32
  per_device_eval_batch_size: !!int 32
  save_total_limit: !!int 1
  metric_for_best_model: eval_loss
  load_best_model_at_end: !!bool true
  greater_is_better: !!bool false
  eval_strategy: steps
  eval_steps: !!float 0.1
  prediction_loss_only: !!bool true
  save_strategy: steps
  save_steps: !!float 0.1
  ddp_find_unused_parameters: !!bool false
  auto_find_batch_size: !!bool false
  learning_rate: !!float 2e-4
  gradient_accumulation_steps: !!int 1
  remove_unused_columns: !!bool false
  local_rank: !!int -1
  use_cache: !!bool false
  logging_steps: !!int 50
  num_train_epochs: !!int 1
