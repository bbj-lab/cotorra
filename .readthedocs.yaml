# Read the Docs configuration file
# See https://docs.readthedocs.com/platform/stable/intro/zensical.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # git-revision-date-localized needs full history; RTD clones shallow by default
    # (zensical doesn't run that plugin yet; see zensical.toml)
    post_checkout:
      - git fetch --unshallow || true
    build:
      html:
        - zensical build
    post_build:
      # Read the Docs publishes what's in $READTHEDOCS_OUTPUT/html
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive site/* $READTHEDOCS_OUTPUT/html/

python:
  install:
    - path: .
      extra_requirements:
        - docs
