name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly, to catch breakage from new releases of unpinned dependencies
    - cron: "0 11 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # every version requires-python in pyproject.toml allows; it stops short of
        # 3.15, for which only pytorch's cpu index has torch wheels, and those
        # segfault loading a saved model
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # the readme's install, with torch's cpu wheels for its cuda ones, which are
      # gigabytes and of no use on a runner without a gpu
      - run: >-
          pip install '.[test]' pytest-cov
          --index-url https://download.pytorch.org/whl/cpu
          --extra-index-url https://pypi.org/simple
      - run: pytest --cov --cov-report=xml
      # coverage is informative only: codecov.yml keeps its checks from failing, and
      # neither a failed upload nor codecov being down fails the job
      - uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          name: python-${{ matrix.python-version }}
          fail_ci_if_error: false

  pytest-lowest:
    # each dependency at the oldest version pyproject.toml allows
    name: pytest (python 3.11, lowest dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: >-
          uv pip install --system --resolution lowest-direct --torch-backend cpu
          '.[test]'
      - run: pytest

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .
