[project]
    authors = [
        { name = "Michael C. Burkhart <burkh4rt@uchicago.edu>, Luke Solo <lsolo@uchicago.edu>, Inhyeok Lee <ihlee@uchicago.edu>, S'Khaja Charles <skhaja@uchicago.edu>, & Brett K. Beaulieu-Jones <beaulieujones@uchicago.edu>" },
    ]
    classifiers = [
        "Development Status :: 2 - Pre-Alpha",
        "Intended Audience :: Science/Research",
        "Natural Language :: English",
        "Programming Language :: Python :: 3",
    ]
    dependencies = [
        "accelerate>=1.3",
        "cocoa-tokenizer>=26.9.1",
        "datasets>=4.4",
        "huggingface-hub>=1.5",
        "joblib>=1.5.2",
        "lightgbm>=4.6",
        "numpy>=2.0",
        "omegaconf>=2.2.1",
        "optuna>=3.1",
        "polars>=1.36.1",
        "rich>=13.8",
        "scikit-learn>=1.8",
        "torch>=2.6",
        "torch>=2.8; sys_platform == 'darwin'",
        "tqdm>=4.66.3",
        "transformers>=5.5.4",
        "typer>=0.26",
        "xgboost>=1.7",
        "wandb>=0.17.2",
    ]
    description = "configurable trainer for generative event models"
    keywords = [
        "model training",
        "generative event models",
        "configurable training",
    ]
    license = "MIT"
    license-files = [ "LICEN[CS]E.*" ]
    name = "cotorra"
    readme = { file = "README.md", content-type = "text/markdown" }
    requires-python = ">=3.11"
    version = "26.9.0"

    [project.scripts]
        cotorra = "cotorra.cli:main"

    [project.urls]
        Documentation = "https://cotorra.readthedocs.io"
        Issues        = "https://github.com/bbj-lab/cotorra/issues"
        Repository    = "https://github.com/bbj-lab/cotorra"

    [project.optional-dependencies]
        all = [ "cotorra[dev,docs,test]" ]
        dev = [ "pip>=23.1", "ruff>=0.15" ]
        docs = [
            "mkdocs>=1.5.3,<2",
            "mkdocs-material>=9.5",
            "mkdocstrings[python]>=0.26.1",
            "mkdocs-include-markdown-plugin>=2.6",
            "mkdocs-callouts>=1.10",
            "mkdocs-git-revision-date-localized-plugin>=0.7",
        ]
        gen = [
            "quick-sco-re @ git+https://github.com/lukesolo-ml/SCOPE_REACH_optimized_inference.git",
            "sglang>=0.5.11",
        ]
        test = [ "pytest>=7.3.2" ]

[build-system]
    build-backend = "setuptools.build_meta"
    requires      = [ "setuptools>=77", "wheel" ]

[tool.ruff]
    extend-exclude = [ "*.md" ]
    line-length    = 88

    [tool.ruff.format]
        docstring-code-format     = true
        indent-style              = "space"
        line-ending               = "lf"
        quote-style               = "double"
        skip-magic-trailing-comma = true

    [tool.ruff.lint]
        ignore = [ "E731" ]
        select = [ "E", "F", "I" ]

        [tool.ruff.lint.isort]
            known-first-party       = [ "cocoa", "cotorra", "coreopsis" ]
            split-on-trailing-comma = false

[tool.setuptools]
    include-package-data = true

    [tool.setuptools.packages.find]
        where = [ "src" ]

    [tool.setuptools.package-data]
        "cotorra.config" = [ "*.yaml" ]

[tool.pytest.ini_options]
    addopts = [
        "--import-mode=importlib",
        "--strict-config",
        "--strict-markers",
    ]
    log_level = "INFO"
    markers = [
        "slow: exercises a real (tiny) training loop; deselect with -m 'not slow'",
    ]
    pythonpath = [ "src", "tests" ]
    testpaths = [ "tests" ]
